name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ hashFiles('build.sh') }}

      - name: Build and test
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: patches
          path: build/patches.rvp
